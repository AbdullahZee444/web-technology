<!DOCTYPE html>
<html>
<head>
    <title>Mini Road Racer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="car.css">
</head>

<body>

<h1>MINI ROAD RACER</h1>

<div class="score">
    Score: 0 &nbsp; Speed: 40 &nbsp; Level: 1
</div>

<div class="road">

    <div class="line line1"></div>
    <div class="line line2"></div>
    <div class="line line3"></div>
    <div class="line line4"></div>

    <div class="car car1">
        <img src="enmcar.png" alt="Enemy car">
    </div>

    <div class="car car2">
        <img src="enmcar2.png" alt="Blue car">
    </div>

    <div class="car car3">
        <img src="enmcar3.png" alt="Red car">
    </div>

    <div class="mycar">
        <img src="mycar.png" alt="Player car">
    </div>

</div>

<button class="start">START RACE</button>

<p class="footer">Don't hit the car</p>

</body>
</html>
