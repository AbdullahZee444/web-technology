<!DOCTYPE html>

<html lang="en">

<head>

    <title>NUML Islamabad</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

</head>

<body>

    <div class="container">

        <h1 class="text-center">NUML Islamabad Registration</h1>

        <div class="row">

            <div class="col-md-6">

                <h3>Registration Form</h3>

                <form>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" class="form-control">
                    </div>

                    <h4>Skills</h4>

                    <div class="checkbox">
                        <label>
                            <input type="checkbox"> HTML
                        </label>
                    </div>

                    <div class="checkbox">
                        <label>
                            <input type="checkbox"> CSS
                        </label>
                    </div>

                    <div class="checkbox">
                        <label>
                            <input type="checkbox" disabled> Bootstrap
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>

                </form>

                <h3>Available Courses</h3>

                <table class="table table-bordered">

                    <tr>
                        <th>Course</th>
                        <th>Fee</th>
                    </tr>

                    <tr>
                        <td>HTML</td>
                        <td>5000</td>
                    </tr>

                    <tr>
                        <td>CSS</td>
                        <td>6000</td>
                    </tr>

                    <tr>
                        <td>Bootstrap</td>
                        <td>7000</td>
                    </tr>

                </table>

            </div>

            <div class="col-md-6">

                <h3>NUML Islamabad</h3>

                <img src="numl.png" class="img-circle" width="150" height="150">

                <br><br>

                <ul class="nav nav-pills">

                    <li class="active">
                        <a href="#">Overview</a>
                    </li>

                    <li>
                        <a href="#">Courses</a>
                    </li>

                    <li>
                        <a href="#">Contact</a>
                    </li>

                </ul>

                <h3>Overview</h3>

                <button type="button" class="btn btn-primary">Learn More</button>

            </div>

        </div>

    </div>

</body>

</html>
